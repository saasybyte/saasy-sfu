[package]
name = "saasy-sfu"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
config = "0.15"
dotenvy = "0.15"
mediasoup = "0.20"
rand = "0.9"
saasy-proto-rust = { git = "https://github.com/saasybyte/saasy-proto-rust.git", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.17", features = ["v4"] }
